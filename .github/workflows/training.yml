name: Training

on:
  push:
    paths:
      - 'data/**'
      - 'src/**'
      - 'requirements.txt'
  workflow_dispatch: # Allow manual trigger

jobs:
  train-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train All Models
        run: |
          python -c "from src.pipeline import generate_and_export_model; generate_and_export_model(data_path='data/titanic_passengers_data.csv', output_dir='results', model_choice='all')"
          
      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          
          if git diff --staged --quiet; then
            echo "No changes to commit in results directory"
          else
            git commit -m "Automated model training update"
            git push
          fi
